name: Issue sweep

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: octo-product-steward-issue-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect material Issue changes and notify Octo only when needed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OCTO_WEBHOOK_URL: ${{ secrets.OCTO_WEBHOOK_URL_ACTIVE }}
        run: node scripts/sweep-issues.mjs
      - name: Persist the new scan baseline
        run: |
          if git diff --quiet -- state/sweep-state.json; then
            exit 0
          fi
          git config user.name "octo-product-steward[bot]"
          git config user.email "octo-product-steward[bot]@users.noreply.github.com"
          git add state/sweep-state.json
          git commit -m "chore: record issue sweep state"
          git push
